<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MartinTech TV - Acceso</title>
    <style>
        body { 
            background-color: #0b0f19; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            padding-top: 10vh; 
            margin: 0; 
        }
        .card { 
            background: #161b22; 
            padding: 30px; 
            border-radius: 20px; 
            display: inline-block; 
            border: 2px solid #58a6ff; 
            width: 85%; 
            max-width: 400px; 
            box-shadow: 0 10px 50px rgba(0,0,0,0.7); 
        }
        h1 { color: #58a6ff; font-size: 28px; margin-bottom: 5px; }
        .status { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        
        input { 
            font-size: 32px; 
            width: 80%; 
            padding: 10px; 
            text-align: center; 
            border-radius: 10px; 
            border: 2px solid #30363d; 
            background: #0d1117; 
            color: white; 
            margin-bottom: 20px; 
            outline: none; 
        }
        input:focus { border-color: #58a6ff; }

        .btn { 
            background: #238636; 
            color: white; 
            padding: 15px 40px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 20px; 
            cursor: pointer; 
            width: 85%; 
        }
        .btn:disabled { background: #215732; cursor: not-allowed; }

        #downloadArea { 
            display: none; 
            margin-top: 30px; 
            border-top: 1px solid #30363d; 
            padding-top: 25px; 
        }
        .btn-dl { 
            background: #1f6feb; 
            color: white; 
            text-decoration: none; 
            padding: 20px; 
            display: block; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 22px; 
        }
        .footer { margin-top: 25px; color: #8b949e; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MARTINTECH TV</h1>
        <div class="status" id="status">Sistema de Nube Activo</div>
        
        <input type="number" id="pinInput" placeholder="PIN" pattern="\d*">
        <br>
        <button class="btn" id="btnValidar" onclick="validarAcceso()">VALIDAR PIN</button>

        <div id="downloadArea">
            <p style="color: #3fb950; font-weight: bold; margin-bottom: 15px;">✅ ACCESO AUTORIZADO</p>
            <a href="https://www.mediafire.com/tu_archivo_apk" class="btn-dl">📥 DESCARGAR APK</a>
        </div>

        <div class="footer">
            Soporte: 11 6968 9385
        </div>
    </div>

    <script>
        async function validarAcceso() {
            const btn = document.getElementById("btnValidar");
            const pinUsuario = document.getElementById("pinInput").value;
            const status = document.getElementById("status");
            
            if(!pinUsuario) { alert("Poné el PIN, Martin."); return; }

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            // Tu link de Pastebin corregido
            const urlRaw = "https://pastebin.com/raw/KEmQ0NjJ";
            
            // Bypass de CORS y Caché para que lea el PIN al instante
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(urlRaw + '?t=' + Date.now())}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error();
                
                const data = await response.text();
                const pinCorrecto = data.trim();

                if (pinUsuario.trim() === pinCorrecto) {
                    document.getElementById("downloadArea").style.display = "block";
                    document.getElementById("pinInput").style.display = "none";
                    btn.style.display = "none";
                    status.innerText = "Sesión validada correctamente";
                } else {
                    alert("PIN incorrecto. Pedile el nuevo a Martin al 11 6968 9385.");
                    btn.innerText = "VALIDAR PIN";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Error de conexión con la nube. Reintentá en un momento.");
                btn.innerText = "REINTENTAR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

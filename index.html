<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MartinTech TV - Panel de Acceso</title>
    <style>
        /* Estilo profesional para TV Box y PC */
        body { 
            background-color: #0b0f19; 
            color: white; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            padding-top: 8vh; 
            margin: 0; 
        }
        .card { 
            background: #161b22; 
            padding: 30px; 
            border-radius: 25px; 
            display: inline-block; 
            border: 2px solid #58a6ff; 
            width: 90%; 
            max-width: 420px; 
            box-shadow: 0 10px 50px rgba(0,0,0,0.8); 
        }
        h1 { color: #58a6ff; font-size: 28px; margin-bottom: 5px; text-transform: uppercase; }
        .status { color: #8b949e; font-size: 14px; margin-bottom: 25px; }
        
        /* Input y Botón de entrada */
        input { 
            font-size: 32px; 
            width: 80%; 
            padding: 12px; 
            text-align: center; 
            border-radius: 12px; 
            border: 2px solid #30363d; 
            background: #0d1117; 
            color: white; 
            margin-bottom: 20px; 
            outline: none; 
        }
        input:focus { border-color: #58a6ff; }
        .btn-validar { 
            background: #238636; 
            color: white; 
            padding: 18px; 
            border: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 20px; 
            cursor: pointer; 
            width: 88%; 
            transition: 0.2s;
        }
        .btn-validar:active { transform: scale(0.95); }

        /* Área de descargas con botones de colores */
        #downloadArea { display: none; margin-top: 25px; border-top: 1px solid #30363d; padding-top: 25px; }
        .btn-link { 
            color: white; 
            text-decoration: none; 
            padding: 20px; 
            display: block; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 18px; 
            margin-bottom: 15px; 
            transition: 0.3s;
        }
        .pelis { background-color: #e11d48; } /* Rojo */
        .tv-futbol { background-color: #2563eb; } /* Azul */
        .magis { background-color: #9333ea; } /* Morado */
        
        .footer { margin-top: 25px; color: #8b949e; font-size: 13px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>MARTINTECH TV</h1>
        <div class="status" id="status">Panel de Control - Benavidez</div>
        
        <div id="loginArea">
            <input type="number" id="pinInput" placeholder="PIN" pattern="\d*">
            <br>
            <button class="btn-validar" id="btnValidar" onclick="validarAcceso()">INGRESAR</button>
        </div>

        <div id="downloadArea">
            <p style="color: #3fb950; font-weight: bold; margin-bottom: 20px;">✅ ACCESO CONCEDIDO</p>
            
            <a href="https://movieplus-apk.com/MoviePlus10TVs.apk" class="btn-link pelis">🎬 MOVIE PLUS (Peliculas)</a>
            
            <a href="https://bit.ly/tele-latino-tv" class="btn-link tv-futbol">⚽ TELE LATINO (TV y Fútbol)</a>
            
            <a href="https://cdn.magistv.video/magistv.apk" class="btn-link magis">📺 MAGIS TV (Opción 3)</a>
        </div>

        <div class="footer">
            Soporte: 11 6968 9385
        </div>
    </div>

    <script>
        async function validarAcceso() {
            const btn = document.getElementById("btnValidar");
            const pinUsuario = document.getElementById("pinInput").value;
            
            if(!pinUsuario) { alert("Por favor, ingresá el PIN."); return; }

            btn.innerText = "VERIFICANDO...";
            btn.disabled = true;

            // Link de tu Pastebin
            const urlRaw = "https://pastebin.com/raw/KEmQ0NjJ";
            
            // Proxy para evitar bloqueos y caché
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(urlRaw + '?t=' + Date.now())}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.text();
                const pinCorrecto = data.trim();

                if (pinUsuario.trim() === pinCorrecto) {
                    document.getElementById("downloadArea").style.display = "block";
                    document.getElementById("loginArea").style.display = "none";
                    document.getElementById("status").innerText = "Sesión validada";
                } else {
                    alert("PIN incorrecto o vencido. Contactate con Martin.");
                    btn.innerText = "INGRESAR";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Error de conexión. Intentá de nuevo.");
                btn.innerText = "REINTENTAR";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
